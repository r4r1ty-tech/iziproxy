name: Build Linux AppImage

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish Linux Single File
      run: dotnet publish IziProxy.GUI/IziProxy.GUI.Desktop/IziProxy.GUI.Desktop.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o publish_linux

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y wget

    - name: Build AppImage
      # Используем закоммиченный AppDir/ — AppRun, .desktop и svg не
      # перезаписываем. Только кладём бинарь и собираем AppImage.
      run: |
        mkdir -p AppDir/usr/bin
        cp publish_linux/IziProxy.GUI.Desktop AppDir/usr/bin/IziProxy
        chmod +x AppDir/usr/bin/IziProxy

        wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
        chmod +x appimagetool
        ./appimagetool --appimage-extract
        ARCH=x86_64 ./squashfs-root/AppRun AppDir IziProxy-x86_64.AppImage

    - name: Upload AppImage to Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "$(gh release view --json tagName -q .tagName)" IziProxy-x86_64.AppImage --clobber

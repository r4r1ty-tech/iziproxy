name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────
  # 1. Windows x86 — один EXE, self-contained
  # ────────────────────────────────────────────────
  build-windows-x86:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows x86
        run: |
          dotnet publish IziProxy.GUI/IziProxy.GUI.Desktop/IziProxy.GUI.Desktop.csproj `
            -c Release `
            -r win-x86 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish_win_x86

      - name: Rename EXE
        run: Rename-Item publish_win_x86\IziProxy.GUI.Desktop.exe IziProxy-win-x86.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-x86
          path: publish_win_x86\IziProxy-win-x86.exe

  # ────────────────────────────────────────────────
  # 2. Windows ARM64 — один EXE, self-contained
  # ────────────────────────────────────────────────
  build-windows-arm64:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows ARM64
        run: |
          dotnet publish IziProxy.GUI/IziProxy.GUI.Desktop/IziProxy.GUI.Desktop.csproj `
            -c Release `
            -r win-arm64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish_win_arm64

      - name: Rename EXE
        run: Rename-Item publish_win_arm64\IziProxy.GUI.Desktop.exe IziProxy-win-arm64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-arm64
          path: publish_win_arm64\IziProxy-win-arm64.exe

  # ────────────────────────────────────────────────
  # 3. Linux x64 — AppImage, self-contained
  # ────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Linux x64
        run: |
          dotnet publish IziProxy.GUI/IziProxy.GUI.Desktop/IziProxy.GUI.Desktop.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -o publish_linux

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y wget

      - name: Build AppImage
        # Используем закоммиченные AppDir/AppRun, AppDir/*.desktop,
        # AppDir/iziproxy.png. Перезаписывать их не нужно — раньше workflow
        # генерил .desktop с Exec=IziProxy (без пути), и при клике через DE
        # AppImage не находил бинарь в usr/bin/.
        run: |
          mkdir -p AppDir/usr/bin
          cp publish_linux/IziProxy.GUI.Desktop AppDir/usr/bin/IziProxy
          chmod +x AppDir/usr/bin/IziProxy

          # Новый appimagetool (AppImage/appimagetool) кладёт статический
          # runtime: AppImage не требует libfuse2 на системе пользователя.
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          # -u встраивает update information и создаёт .zsync для AppImageUpdate
          ARCH=x86_64 ./squashfs-root/AppRun -u "gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|IziProxy-x86_64.AppImage.zsync" AppDir IziProxy-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            IziProxy-x86_64.AppImage
            IziProxy-x86_64.AppImage.zsync

  # ────────────────────────────────────────────────
  # 4. Android APK
  # ────────────────────────────────────────────────
  build-android:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android Workload
        run: dotnet workload install android

      - name: Accept Android SDK Licenses and Install Dependencies
        run: |
          dotnet build -t:InstallAndroidDependencies `
            -f net10.0-android `
            -p:AcceptAndroidSDKLicenses=true `
            IziProxy.GUI/IziProxy.GUI.Android/IziProxy.GUI.Android.csproj

      - name: Decode keystore
        # Без секрета keystore не создаётся, и APK подписывается debug-ключом.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:ANDROID_KEYSTORE_BASE64) {
            Write-Host "::warning::ANDROID_KEYSTORE_BASE64 не задан — APK будет подписан debug-ключом"
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          $keystorePath = Join-Path $env:GITHUB_WORKSPACE "iziproxy-release.keystore"
          [IO.File]::WriteAllBytes($keystorePath, $bytes)

      - name: Publish Android APK (Release)
        env:
          JAVA_TOOL_OPTIONS: -Xmx4g
        run: |
          dotnet publish IziProxy.GUI/IziProxy.GUI.Android/IziProxy.GUI.Android.csproj `
            -c Release `
            -f net10.0-android `
            -p:AndroidPackageFormat=apk

      - name: Build Android APK (Debug)
        env:
          JAVA_TOOL_OPTIONS: -Xmx4g
        run: |
          dotnet build IziProxy.GUI/IziProxy.GUI.Android/IziProxy.GUI.Android.csproj `
            -c Debug `
            -f net10.0-android `
            -p:AndroidPackageFormat=apk

      - name: Find APKs and stage them
        run: |
          # Находим Release APK
          $releaseApk = Get-ChildItem -Path "IziProxy.GUI/IziProxy.GUI.Android/bin/Release/net10.0-android/" -Recurse -Filter "*-Signed.apk" | Select-Object -First 1
          if (-not $releaseApk) {
            $releaseApk = Get-ChildItem -Path "IziProxy.GUI/IziProxy.GUI.Android/bin/Release/net10.0-android/" -Recurse -Filter "*.apk" | Select-Object -First 1
          }
          if ($releaseApk) {
            Copy-Item $releaseApk.FullName "IziProxy-Release.apk"
          } else {
            Write-Error "Release APK not found!"; exit 1
          }

          # Находим Debug APK
          $debugApk = Get-ChildItem -Path "IziProxy.GUI/IziProxy.GUI.Android/bin/Debug/net10.0-android/" -Recurse -Filter "*-Signed.apk" | Select-Object -First 1
          if (-not $debugApk) {
            $debugApk = Get-ChildItem -Path "IziProxy.GUI/IziProxy.GUI.Android/bin/Debug/net10.0-android/" -Recurse -Filter "*.apk" | Select-Object -First 1
          }
          if ($debugApk) {
            Copy-Item $debugApk.FullName "IziProxy-Debug.apk"
          } else {
            Write-Error "Debug APK not found!"; exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            IziProxy-Release.apk
            IziProxy-Debug.apk

  # ────────────────────────────────────────────────
  # 5. Создаём релиз и загружаем все артефакты
  # ────────────────────────────────────────────────
  publish-release:
    needs: [build-windows-x86, build-windows-arm64, build-linux, build-android]
    # Релиз публикуется, даже если упала Android-сборка: desktop-артефакты
    # не должны зависеть от неё. APK просто не попадут в релиз.
    if: ${{ !cancelled() && needs.build-windows-x86.result == 'success' && needs.build-windows-arm64.result == 'success' && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          files=(
            artifacts/win-x86/IziProxy-win-x86.exe
            artifacts/win-arm64/IziProxy-win-arm64.exe
            artifacts/linux-appimage/IziProxy-x86_64.AppImage
            artifacts/linux-appimage/IziProxy-x86_64.AppImage.zsync
          )
          for apk in artifacts/android-apk/IziProxy-Release.apk artifacts/android-apk/IziProxy-Debug.apk; do
            [ -f "$apk" ] && files+=("$apk")
          done

          gh release create "$TAG_NAME" \
            --title "IziProxy $TAG_NAME" \
            --generate-notes \
            --latest \
            "${files[@]}"
